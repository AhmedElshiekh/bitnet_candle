[package]
name = "bitnet_candle"
version = "0.1.0"
edition = "2021"

[dependencies]
# توحيد كل إصدارات candle على 0.10.2
candle-core = { version = "0.10.2", default-features = false }
candle-nn = { version = "0.10.2", default-features = false }
candle-transformers = { version = "0.10.2", default-features = false }

# حل مشكلة tokenizers في بيئة Termux/Android
tokenizers = { version = "0.22.2", default-features = false, features = ["unstable_wasm"] }

# مكاتب مساعدة بأحدث إصدارات مستقرة
safetensors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
half = { version = "2.4", features = ["rand_distr"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
